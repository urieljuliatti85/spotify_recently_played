# SQLite in development/test. Versions 3.8.0 and up are supported.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate

test:
  <<: *default
  database: storage/test.sqlite3

# PostgreSQL in production. One DATABASE_URL supplies host/user/password;
# cache/queue/cable get their own logical database on the same server so a
# runaway cache write can't lock out the plays table (the old SQLite setup's
# reason for splitting files still applies to Postgres schemas/databases).
<% production_db_url = URI.parse(ENV.fetch("DATABASE_URL", "postgresql:///spotify_recently_played_production")) %>
<% production_db_name = production_db_url.path.delete_prefix("/") %>

production:
  primary: &primary_production
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    host: <%= production_db_url.host.presence %>
    port: <%= production_db_url.port || 5432 %>
    username: <%= production_db_url.user %>
    password: <%= production_db_url.password %>
    database: <%= production_db_name %>
  cache:
    <<: *primary_production
    database: <%= production_db_name %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= production_db_name %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= production_db_name %>_cable
    migrations_paths: db/cable_migrate
