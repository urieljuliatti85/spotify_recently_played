default: &default
  sync_spotify_recently_played:
    class: SyncAllAccountsJob
    queue: default
    # Spotify only keeps the last 50 plays, so poll often enough to avoid
    # losing history while keeping API usage moderate.
    schedule: every 1 minute

  backfill_youtube_matches:
    class: BackfillYoutubeMatchesJob
    queue: default
    # One search every 30 minutes is 48 a day — comfortably under the
    # YouTube Data API's default 100-search daily quota even alongside
    # whatever a visitor's own page load resolves in the foreground.
    schedule: every 30 minutes

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
