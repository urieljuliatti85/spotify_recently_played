default: &default
  sync_spotify_recently_played:
    class: SyncRecentlyPlayedJob
    queue: default
    # Spotify only keeps the last 50 plays, so poll often enough to avoid
    # losing history while keeping API usage moderate.
    schedule: every 1 minute

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
