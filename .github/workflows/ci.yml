name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  # A new advisory can land against a dependency nobody touched, so the scans
  # re-run on their own rather than waiting for the next pull request.
  schedule:
    - cron: "27 5 * * 1"

# A push replaces whatever CI was already running for the same branch/PR
# rather than queuing behind it — a few commits in quick succession would
# otherwise run the full job matrix once per push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    permissions:
      # Uploading Brakeman's findings to the repository's Security tab,
      # alongside CodeQL's (see codeql.yml).
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      # A second, non-blocking run (a full scan of this app takes well under
      # a second) just to get a SARIF report out of it — the step above
      # already decides pass/fail, so this one runs regardless of that
      # result (`if: always()`) and never fails the job on its own account
      # (`--no-exit-on-warn`), purely to hand the same findings to the
      # Security tab, next to CodeQL's (see codeql.yml).
      - name: Generate a SARIF report of the findings above
        if: always()
        run: bin/brakeman -f sarif -o brakeman-results.sarif -q --no-exit-on-warn --no-pager

      - name: Upload Brakeman findings to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: brakeman-results.sarif
          category: brakeman

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # `npm audit` reads package-lock.json and asks the registry, so there is
      # nothing to install first. Dev dependencies stay in scope on purpose:
      # Vite builds the bundle this site ships, so a compromised build tool is
      # a compromised page.
      - name: Scan for known security vulnerabilities in npm packages
        run: npm audit --audit-level=moderate

  lint:
    runs-on: ubuntu-latest
    permissions:
      # Uploading RuboCop's findings to the repository's Security tab,
      # alongside Brakeman's (scan_ruby) and CodeQL's (codeql.yml).
      security-events: write
      contents: read
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      # Has to run before autocorrect touches anything below — a SARIF report
      # generated after `-A` has already fixed the offenses would show a
      # clean scan no matter what the committed code actually looked like.
      # `continue-on-error` because this step is purely informational: RuboCop
      # exits 1 when it finds something, and the real gate is further down
      # (autocorrect, then failing on whatever autocorrect couldn't fix).
      - name: Generate a SARIF report of the committed code
        continue-on-error: true
        run: |
          bundle exec rubocop --require code_scanning --format CodeScanning::SarifFormatter -o rubocop.sarif --format github

      - name: Upload RuboCop findings to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rubocop.sarif
          category: rubocop

      - name: Autocorrect RuboCop offenses
        run: |
          bin/rubocop -A -f github

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Check for uncommitted RuboCop corrections
        run: |
          git diff --exit-code

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build the frontend
        run: bin/vite build

      - name: Run frontend tests
        run: npm test

      - name: Run tests
        env:
          RAILS_ENV: test
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: test-primary-key-test-primary-key-
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: test-deterministic-key
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: test-key-derivation-salt
        run: |
          bin/rails db:test:prepare
          bin/rails test

  # A failure here means nobody is watching — main just broke, or the weekly
  # scan just found a new advisory against a dependency nobody touched. A PR
  # failure is already visible to whoever opened it, so this only fires for
  # push (to main) and the scheduled run. One open issue is kept updated
  # rather than filing a new one per failure, so a red main does not spam the
  # tracker every time someone pushes before it is fixed.
  notify_on_failure:
    name: Notify on CI failure
    needs: [ scan_ruby, scan_js, lint, test ]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the CI failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = `CI failed on \`${context.sha.slice(0, 7)}\` ` +
              `(${context.eventName}) — [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ci-failure",
            })

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "CI is failing on main",
                body,
                labels: [ "ci-failure" ],
              })
            }
